# ?? Spring Boot ????
spring.application.name=FocusGuardServer

# ?? MySQL ???????????
spring.datasource.url=jdbc:mysql://localhost:3306/focusguard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8

# ???????????????????? root
spring.datasource.username=${DB_USERNAME:root}

# ????????????
spring.datasource.password=${DB_PASSWORD}

# ???????????????
spring.jpa.hibernate.ddl-auto=update

# ????????? SQL?????
spring.jpa.show-sql=true

# ???????? SQL
spring.jpa.properties.hibernate.format_sql=true

# ?????????? Controller ?
spring.jpa.open-in-view=false

# JWT ???????????????
app.jwt.secret=${JWT_SECRET}

# JWT ????86400000 ???? 24 ??
app.jwt.expiration-ms=86400000

# SMTP 服务器地址，默认使用 QQ 邮箱，也可以通过环境变量切换
spring.mail.host=${MAIL_HOST:smtp.qq.com}

# 587 端口使用 STARTTLS 加密连接
spring.mail.port=${MAIL_PORT:587}

# 发件邮箱完整地址，例如 example@qq.com
spring.mail.username=${MAIL_USERNAME:}

# 邮箱 SMTP 授权码，不是邮箱登录密码
spring.mail.password=${MAIL_PASSWORD:}

# SMTP 服务器需要账号认证
spring.mail.properties.mail.smtp.auth=true

# 连接后升级为 TLS 加密通信
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# 设置有限超时，避免邮件服务器无响应时请求一直等待
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 邮件标题和正文统一使用 UTF-8
spring.mail.default-encoding=UTF-8
