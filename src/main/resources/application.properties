# 设置 Spring Boot 项目名称
spring.application.name=FocusGuardServer

# 云平台会通过 PORT 指定服务端口，本地没有设置时仍使用 8080
server.port=${PORT:8080}

# 数据库连接地址。本地默认连接 focusguard，云端通过 DB_URL 覆盖
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/focusguard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}

# 数据库用户名。本地默认使用 root，云端通过 DB_USERNAME 覆盖
spring.datasource.username=${DB_USERNAME:root}

# 数据库密码必须通过环境变量提供，不能写入 Git
spring.datasource.password=${DB_PASSWORD}

# 根据实体类自动更新数据库表结构
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# 是否在控制台显示 SQL，本地默认开启，云端可设置为 false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# 是否格式化控制台中的 SQL
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# 禁止在 Controller 层继续延迟读取数据库对象
spring.jpa.open-in-view=false

# JWT 签名密钥必须通过环境变量提供
app.jwt.secret=${JWT_SECRET}

# JWT 有效期，默认 24 小时
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# SMTP 服务器地址，默认使用 QQ 邮箱，也可以通过环境变量切换
spring.mail.host=${MAIL_HOST:smtp.qq.com}

# 587 端口使用 STARTTLS 加密连接
spring.mail.port=${MAIL_PORT:587}

# 发件邮箱完整地址，例如 example@qq.com
spring.mail.username=${MAIL_USERNAME:}

# 邮箱 SMTP 授权码，不是邮箱登录密码
spring.mail.password=${MAIL_PASSWORD:}

# SMTP 服务器需要账号认证
spring.mail.properties.mail.smtp.auth=true

# 连接后升级为 TLS 加密通信
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# 设置有限超时，避免邮件服务器无响应时请求一直等待
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 邮件标题和正文统一使用 UTF-8
spring.mail.default-encoding=UTF-8
